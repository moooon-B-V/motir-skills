name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skills, SYNC.json, secrets, manifest, directory shape and the runner's npm pin agree
        run: python3 scripts/validate.py
      - name: Install coverage (CI only — the scripts themselves stay standard-library)
        run: python3 -m pip install coverage
      - name: Unit and integration tests, under branch coverage
        run: |
          python3 -m coverage run -a --branch scripts/test_section_hash.py
          python3 -m coverage run -a --branch scripts/test_validate.py
          python3 -m coverage run -a --branch scripts/test_motir.py
          python3 -m coverage run -a --branch scripts/test_integration.py
      - name: validate.py stays at or above 90% line and branch coverage
        run: python3 -m coverage report -m --include=scripts/validate.py --fail-under=90
      - name: Claude Code accepts the marketplace and plugin manifests, warnings included
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate plugins/motir --strict
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate plugins/motir/.claude-plugin/plugin.json --strict

  install-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: A clean Claude Code installs the plugin from this checkout (fresh HOME and CLAUDE_CONFIG_DIR)
        run: sh scripts/install-e2e.sh "$GITHUB_WORKSPACE"
        env:
          TRANSCRIPT: ${{ runner.temp }}/install-transcript.txt
      - name: Upload the install transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-transcript
          path: ${{ runner.temp }}/install-transcript.txt
          if-no-files-found: error
