name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skills, SYNC.json, secrets and manifest agree
        run: python3 scripts/validate.py
      - name: section-hash.py self-test
        run: python3 scripts/test_section_hash.py
      - name: Claude Code accepts the marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate .claude-plugin/plugin.json
